name: Preview or promote the exact qualified native release
on:
  push:
    branches: [codex/debug-quality-qualification]
    paths: [.github/workflows/promote-debug-quality.yml]
  workflow_dispatch:
    inputs:
      qualification_run:
        description: Successful complete action and sanitizer qualification run
        type: string
        required: true
      publish:
        description: Publish the reviewed exact assets as v2026.11.2
        type: boolean
        default: false
permissions:
  contents: read
env:
  SOURCE: e5365e07215ccfe81409ab5652d05a6c98c14606
  TAG: v2026.11.2
jobs:
  preview:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Stage the exact complete qualified release
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_RUN: ${{ inputs.qualification_run }}
        run: python3 .github/scripts/stage-debug-quality-release.py stage qualified/dist --qualification "$QUALIFICATION_RUN"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: debug-quality-release-preview
          path: qualified/
          compression-level: 0
          if-no-files-found: error
          retention-days: 90
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: preview
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: step-security/harden-runner@c6295a65d1254861815972266d5933fd6e532bdf
        with:
          egress-policy: audit
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: debug-quality-release-preview
          path: qualified
      - name: Verify the exact files and refuse an existing release or tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/stage-debug-quality-release.py verify qualified/dist --require-unpublished
      - name: Provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: qualified/dist/*.tar.xz
      - name: Publish exact assets through a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" qualified/dist/* --repo "$GITHUB_REPOSITORY" --draft --target "$SOURCE" \
            --title "elide-toolchain ${TAG#v}" --generate-notes
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
  mirror:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@c6295a65d1254861815972266d5933fd6e532bdf
        with:
          egress-policy: audit
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: debug-quality-release-preview
          path: qualified
      - run: |
          python3 .github/scripts/stage-debug-quality-release.py verify qualified/dist
          mkdir latest && echo 2026.11.2 > latest/latest.txt
      - name: Mirror exact bundles to the existing destination
        uses: elide-tools/r2-upload-action@b59314040b32715ae31337cdbb7418582ade7cff
        with:
          path: ./qualified/dist
          target: toolchain/2026.11.2
          bucket: elide-userdata-public
          account-id: ${{ secrets.R2_ACCOUNT_ID }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - name: Mirror latest using the existing destination
        uses: elide-tools/r2-upload-action@b59314040b32715ae31337cdbb7418582ade7cff
        with:
          path: ./latest
          target: toolchain
          bucket: elide-userdata-public
          account-id: ${{ secrets.R2_ACCOUNT_ID }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - name: Verify every public asset against the qualified manifest
        run: python3 .github/scripts/stage-debug-quality-release.py verify-remote qualified/dist
