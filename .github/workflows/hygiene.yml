name: Repository hygiene

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: '2026.11.1'
          install_args: --locked actionlint shellcheck
      - name: Check contribution sign-offs
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          DCO_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          DCO_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: python3 scripts/check-dco.py
      - run: mise run lint
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
