name: PR

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: "ci-pr-${{ github.event.number }}"
  cancel-in-progress: true

jobs:
  unit:
    name: "Unit tests"
    # Fork PRs never run on the self-hosted pool.
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'linux-amd64-cipool' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - run: git submodule update --init --depth=1 cflags
      - name: "Setup: shellcheck"
        # Self-hosted runners keep packages between jobs; only install when missing.
        run: command -v shellcheck >/dev/null || { sudo apt-get update -qq && sudo apt-get install -qq -y shellcheck; }
      - run: tests/run.sh
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: cd action && bun install --frozen-lockfile && bun run typecheck && bun test
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: unit
    uses: ./.github/workflows/job.build.yml
  e2e:
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    uses: ./.github/workflows/job.action-e2e.yml
