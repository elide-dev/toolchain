name: Coverage

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: First-party coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: '2026.11.1'
          install_args: --locked bun
      - name: Action library coverage
        working-directory: action
        run: |
          bun install --frozen-lockfile
          bun test --coverage --coverage-reporter=lcov --coverage-dir=../dist/coverage/action
      - name: Allocator line and branch coverage
        run: bash .github/scripts/allocator-coverage.sh
      - name: Retain coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: first-party-coverage
          path: |
            dist/coverage/action/lcov.info
            dist/coverage/allocator/coverage.json
            dist/coverage/allocator/summary.txt
            dist/coverage/allocator/fuzz.log
          if-no-files-found: error
