name: Symbol ingestion
on:
  workflow_run:
    workflows: ["CI", "Job - Build", "Release"]
    types: [completed]
permissions:
  contents: read
jobs:
  producer:
    name: Symbol artifacts
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.event != 'pull_request_target'
    uses: ./.github/workflows/job.symbol-artifacts.yml
    permissions:
      contents: read
      actions: read
    with:
      run-id: ${{ github.event.workflow_run.id }}
      artifact-prefix: native-debug-toolchain-
  symbols:
    needs: producer
    if: needs.producer.outputs.available == 'true'
    uses: ./.github/workflows/job.symbols.yml
    permissions:
      contents: read
      actions: read
      id-token: write
    with:
      source_run: ${{ github.event.workflow_run.id }}
