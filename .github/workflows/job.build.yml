name: "Job - Build"

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform subset for build qualification"
        type: choice
        default: all
        options: [all, linux-amd64, linux-arm64, darwin-arm64]
      version:
        description: "Toolchain version (YYYY.MM.N or vYYYY.MM.N); empty = dev build"
        required: false
        type: string
      sanitizer-addons:
        description: "Also build the per-sanitizer add-on archives (linux-amd64)"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      isolated-release:
        description: "Use the single-job release runner pool and private caches"
        required: false
        type: boolean
        default: false
      platform:
        required: false
        type: string
        default: all
      version:
        required: false
        type: string
        default: ""
      sanitizer-addons:
        # Per-sanitizer add-on archives (asan/tsan/msan, x86_64 gnu only). Only push-to-main and
        # release builds set this (spec 2026-10-05 §9); PR builds stay fast.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: "Bundle (${{ matrix.os }}-${{ matrix.arch }})"
    # Release jobs always use the disposable pool; diagnostic selection changes only the platform.
    runs-on: ${{ inputs.isolated-release && matrix.release-runner || matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platform == 'darwin-arm64' && '[{"os":"darwin","arch":"arm64","runner":"darwin-arm64-cipool","release-runner":"darwin-arm64-toolchain-release","timeout":720}]' || inputs.platform == 'linux-amd64' && '[{"os":"linux","arch":"amd64","runner":"linux-amd64-cipool","release-runner":"linux-amd64-toolchain-release","timeout":720}]' || inputs.platform == 'linux-arm64' && '[{"os":"linux","arch":"arm64","runner":"linux-arm64-cipool","release-runner":"linux-arm64-toolchain-release","timeout":720}]' || '[{"os":"linux","arch":"amd64","runner":"linux-amd64-cipool","release-runner":"linux-amd64-toolchain-release","timeout":720},{"os":"linux","arch":"arm64","runner":"linux-arm64-cipool","release-runner":"linux-arm64-toolchain-release","timeout":720},{"os":"darwin","arch":"arm64","runner":"darwin-arm64-cipool","release-runner":"darwin-arm64-toolchain-release","timeout":720}]') }}
    env:
      REQUIRE_CONTAINER_CHECKS: ${{ matrix.os == 'linux' && 'yes' || 'no' }}
      INPUT_VERSION: ${{ inputs.version }}
      BUILD_SANITIZER_VARIANTS: ${{ inputs.sanitizer-addons && 'yes' || 'no' }}
    steps:
      - name: "Setup: Harden Runner"
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: "Setup: Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          fetch-depth: 1
          persist-credentials: false
      - name: "Setup: Submodules"
        # Must stay bash 3.2-safe.
        run: |
          # Self-hosted runners keep .git/modules across jobs; a git process killed by a cancelled run
          # leaves *.lock files that make every later fetch fail. This job owns the workspace.
          if [ -d .git/modules ]; then find .git/modules -name '*.lock' -type f -print -delete; fi
          # Persistent runners may still hold the retired glibc submodule's work tree.
          rm -rf glibc .git/modules/glibc
          # Discard patches from the previous build while switching revisions.
          # A reset after update alone is too late when a patched file changed upstream.
          # Nested shallow repositories can race their shared shallow metadata.
          # Retry serially with exactly the same pinned commits after that failure.
          git submodule update --force --quiet --init --depth=1 --recursive --jobs 8 ||
            git submodule update --force --quiet --init --depth=1 --recursive --jobs 1
          # Persistent runners may hold submodule work trees damaged by earlier jobs (tracked files
          # deleted or modified); `submodule update` does not repair them when HEAD already matches.
          git submodule foreach --recursive --quiet 'git reset -q --hard && git clean -qffdx'
      - name: "Setup: Packages (Linux)"
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y --no-install-recommends build-essential bison gawk python3 ninja-build \
            cmake rsync xz-utils curl clang lld llvm ccache
      - name: "Setup: Packages (macOS)"
        if: matrix.os == 'darwin'
        # GNU rsync: stage_source needs --from0/--files-from, which macOS's openrsync lacks. The
        # self-hosted runner service may not have Homebrew on PATH, so locate brew explicitly and put
        # its bin dir first for this and all later steps; the check below fails the job otherwise.
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew="$(command -v brew || echo /opt/homebrew/bin/brew)"
          "$brew" install --quiet bash ninja cmake rsync xz ccache
          hb="$("$brew" --prefix)/bin"
          export PATH="$hb:$PATH"
          echo "$hb" >> "$GITHUB_PATH"
          v="$(rsync --version 2>&1 || true)"
          echo "rsync: $(command -v rsync): ${v%%$'\n'*}"
          case "$v" in *"rsync  version"*) ;; *) echo "::error::GNU rsync is not first on PATH"; exit 1 ;; esac
      - name: "Setup: Isolated release caches"
        if: inputs.isolated-release
        # The provisioning service destroys the whole guest after one job. A unique,
        # empty directory also prevents accidentally restoring normal CI caches.
        run: |
          cache_root=$(mktemp -d "$RUNNER_TEMP/toolchain-release.XXXXXXXX")
          mkdir -p "$cache_root/downloads" "$cache_root/ccache"
          {
            echo "ELIDE_CACHE_DIR=$cache_root/downloads"
            echo "CCACHE_DIR=$cache_root/ccache"
            echo "USE_SCCACHE=no"
            echo "CCACHE_REMOTE_STORAGE="
            echo "CCACHE_SECONDARY_STORAGE="
            echo "CCACHE_CONFIGPATH=$cache_root/ccache.conf"
          } >> "$GITHUB_ENV"
          printf 'remote_storage =\n' > "$cache_root/ccache.conf"
      - name: "Setup: Build caches"
        if: ${{ !inputs.isolated-release }}
        # Persistent caches live outside the workspace: actions/checkout cleans ignored files, so
        # out/cache would not survive between jobs on these self-hosted runners. Downloads (kernel
        # headers, Propeller deps, the prebuilt stage-1 LLVM) are checksummed by fetch_pinned.
        env:
          CACHE_SCOPE: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || github.ref == 'refs/heads/main' && 'main' || format('review-{0}', github.event.number || github.run_id) }}
        run: |
          c="$HOME/.cache/elide-toolchain/v2/$CACHE_SCOPE/${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p "$c/downloads" "$c/ccache"
          {
            echo "ELIDE_CACHE_DIR=$c/downloads"
            echo "CCACHE_DIR=$c/ccache"
          } >> "$GITHUB_ENV"
          CCACHE_DIR="$c/ccache" ccache --zero-stats
          CCACHE_DIR="$c/ccache" ccache --version | head -n 1
      - name: "Setup: Version"
        id: version
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            v="${INPUT_VERSION#v}"
            if ! [[ "$v" =~ ^[0-9]{4}\.[1-9][0-9]?\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::invalid version '$INPUT_VERSION': want YYYY.M.N (CalVer; month not zero-padded, e.g. 2026.10.0 or 2026.9.1), optionally v-prefixed with a -/+ suffix"
              exit 1
            fi
          else
            v="$(. ./versions.env && echo "$TOOLCHAIN_VERSION")-dev.$(git rev-parse --short HEAD)"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: "Build: Toolchain"
        env:
          TOOLCHAIN_VERSION: ${{ steps.version.outputs.version }}
        run: ./build.sh --clean
      - name: "Report: ccache"
        if: always()
        run: |
          if command -v ccache >/dev/null 2>&1; then ccache --show-stats --verbose; else echo "ccache not installed"; fi
      - name: "Artifact: Bundle"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: elide-toolchain-${{ matrix.os }}-${{ matrix.arch }}
          compression-level: 0
          overwrite: true
          if-no-files-found: error
          path: |
            dist/*
            !dist/*-symbols/**
      - name: "Artifact: Private native debug bundle"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-debug-toolchain-${{ matrix.os }}-${{ matrix.arch }}
          compression-level: 6
          path: dist/*-symbols/
          if-no-files-found: error
          retention-days: 90
      - name: "Artifact: Build logs"
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs-${{ matrix.os }}-${{ matrix.arch }}
          overwrite: true
          if-no-files-found: ignore
          retention-days: 14
          path: out/*/logs/
