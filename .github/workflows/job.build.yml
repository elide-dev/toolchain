name: "Job - Build"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Toolchain version (YYYY.MM.N or vYYYY.MM.N); empty = dev build"
        required: false
        type: string
      sanitizer-addons:
        description: "Also build the per-sanitizer add-on archives (linux-amd64)"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        required: false
        type: string
        default: ""
      sanitizer-addons:
        # Per-sanitizer add-on archives (asan/tsan/msan, x86_64 gnu only). Only push-to-main and
        # release builds set this (spec 2026-10-05 §9); PR builds stay fast.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: "Bundle (${{ matrix.os }}-${{ matrix.arch }})"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, runner: linux-amd64-cipool, timeout: 720 }
          - { os: linux, arch: arm64, runner: linux-arm64-cipool, timeout: 720 }
          - { os: darwin, arch: arm64, runner: darwin-arm64-cipool, timeout: 720 }
    env:
      REQUIRE_CONTAINER_CHECKS: ${{ matrix.os == 'linux' && 'yes' || 'no' }}
      INPUT_VERSION: ${{ inputs.version }}
      BUILD_SANITIZER_VARIANTS: ${{ inputs.sanitizer-addons && 'yes' || 'no' }}
    steps:
      - name: "Setup: Harden Runner"
        uses: step-security/harden-runner@c6295a65d1254861815972266d5933fd6e532bdf # v2.11.1
        with:
          egress-policy: audit
      - name: "Setup: Checkout"
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          submodules: false
          fetch-depth: 1
          persist-credentials: false
      - name: "Setup: Submodules"
        # glibc's gitlink is the tip of release/2.34/master on sourceware.org (canonical, kept in
        # .gitmodules). sourceware returns HTTP 403 to some CI IPs, so the order is: sourceware by SHA,
        # GitHub mirror by SHA, then a mirror branch fetch. The final HEAD == gitlink assertion (and
        # stage 00's scripts/check-versions.sh) keeps the mirror honest. Must stay bash 3.2-safe.
        run: |
          # Self-hosted runners keep .git/modules across jobs; a git process killed by a cancelled run
          # leaves *.lock files that make every later fetch fail. This job owns the workspace.
          if [ -d .git/modules ]; then find .git/modules -name '*.lock' -type f -print -delete; fi
          subs="$(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '$2 != "glibc" {print $2}')"
          # shellcheck disable=SC2086 # submodule paths contain no spaces
          git submodule update --quiet --init --depth=1 --recursive --jobs 8 -- $subs
          rev="$(git ls-tree HEAD glibc | awk '{print $3}')"
          branch="$(git config -f .gitmodules submodule.glibc.branch)"
          mirror="https://github.com/bminor/glibc.git"
          if ! git submodule update --quiet --init --depth=1 glibc; then
            echo "::warning::glibc fetch from sourceware failed; trying $mirror"
            rm -rf glibc ".git/modules/glibc"
            mkdir glibc
            git -C glibc init -q
            if ! { git -C glibc fetch --quiet --depth=1 "$mirror" "$rev" && git -C glibc checkout -q --detach FETCH_HEAD; }; then
              echo "::warning::glibc fetch by SHA from mirror failed; fetching $branch from mirror"
              git -C glibc fetch --quiet --depth=50 "$mirror" "$branch"
              git -C glibc checkout -q --detach "$rev"
            fi
          fi
          test "$(git -C glibc rev-parse HEAD)" = "$rev"
          # Persistent runners may hold submodule work trees damaged by earlier jobs (tracked files
          # deleted or modified); `submodule update` does not repair them when HEAD already matches.
          git submodule foreach --recursive --quiet 'git reset -q --hard && git clean -qffdx'
      - name: "Setup: Packages (Linux)"
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y --no-install-recommends build-essential bison gawk python3 ninja-build \
            cmake rsync xz-utils curl clang lld llvm ccache
      - name: "Setup: Packages (macOS)"
        if: matrix.os == 'darwin'
        # GNU rsync: stage_source needs --from0/--files-from, which macOS's openrsync lacks. The
        # self-hosted runner service may not have Homebrew on PATH, so locate brew explicitly and put
        # its bin dir first for this and all later steps; the check below fails the job otherwise.
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew="$(command -v brew || echo /opt/homebrew/bin/brew)"
          "$brew" install --quiet bash ninja cmake rsync xz ccache
          hb="$("$brew" --prefix)/bin"
          export PATH="$hb:$PATH"
          echo "$hb" >> "$GITHUB_PATH"
          v="$(rsync --version 2>&1 || true)"
          echo "rsync: $(command -v rsync): ${v%%$'\n'*}"
          case "$v" in *"rsync  version"*) ;; *) echo "::error::GNU rsync is not first on PATH"; exit 1 ;; esac
      - name: "Setup: Build caches"
        # Persistent caches live outside the workspace: actions/checkout cleans ignored files, so
        # out/cache would not survive between jobs on these self-hosted runners. Downloads (kernel
        # headers, Propeller deps, the prebuilt stage-1 LLVM) are checksummed by fetch_pinned.
        run: |
          c="$HOME/.cache/elide-toolchain"
          mkdir -p "$c/downloads" "$c/ccache"
          {
            echo "ELIDE_CACHE_DIR=$c/downloads"
            echo "CCACHE_DIR=$c/ccache"
          } >> "$GITHUB_ENV"
          CCACHE_DIR="$c/ccache" ccache --zero-stats
          CCACHE_DIR="$c/ccache" ccache --version | head -n 1
      - name: "Setup: Version"
        id: version
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            v="${INPUT_VERSION#v}"
            if ! [[ "$v" =~ ^[0-9]{4}\.[1-9][0-9]?\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::invalid version '$INPUT_VERSION': want YYYY.M.N (CalVer; month not zero-padded, e.g. 2026.10.0 or 2026.9.1), optionally v-prefixed with a -/+ suffix"
              exit 1
            fi
          else
            v="$(. ./versions.env && echo "$TOOLCHAIN_VERSION")-dev.$(git rev-parse --short HEAD)"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: "Build: Toolchain"
        env:
          TOOLCHAIN_VERSION: ${{ steps.version.outputs.version }}
        run: ./build.sh
      - name: "Report: ccache"
        if: always()
        run: |
          if command -v ccache >/dev/null 2>&1; then ccache --show-stats; else echo "ccache not installed"; fi
      - name: "Artifact: Bundle"
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: elide-toolchain-${{ matrix.os }}-${{ matrix.arch }}
          compression-level: 0
          overwrite: true
          path: dist/*
      - name: "Artifact: Build logs"
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: build-logs-${{ matrix.os }}-${{ matrix.arch }}
          overwrite: true
          if-no-files-found: ignore
          retention-days: 14
          path: out/*/logs/
