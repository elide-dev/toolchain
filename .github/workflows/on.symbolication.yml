name: Symbolication

on:
  workflow_run:
    workflows: ["Symbol ingestion"]
    types: [completed]
  workflow_dispatch:
    inputs:
      ingestion_run:
        description: Successful main-branch ingestion run containing exact readback receipts
        required: true
        type: string

permissions:
  contents: read

jobs:
  symbolicate:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    uses: ./.github/workflows/job.symbolication.yml
    permissions:
      contents: read
      actions: read
      id-token: write
    with:
      ingestion_run: ${{ inputs.ingestion_run || github.event.workflow_run.id }}
