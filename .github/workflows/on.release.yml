name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  unit:
    uses: ./.github/workflows/job.unit.yml
  build:
    needs: unit
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/job.release-build.yml
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: "Setup: Harden Runner"
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: elide-toolchain-*
          merge-multiple: true
          path: dist
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: src
          sparse-checkout: versions.env
          sparse-checkout-cone-mode: false
      - name: "Verify checksums"
        run: cd dist && for f in *.tar.xz; do sha256sum -c "$f.sha256"; done
      - name: "Verify sanitizer add-ons"
        # Every linux-amd64 bundle (SANITIZER_VARIANT_CPUS) ships one add-on per SANITIZER_VARIANTS entry;
        # `elide-toolchain addon install` and the action fetch them by exact name from this release
        # (then R2), so a release must not go out without them.
        run: |
          . src/versions.env
          missing=0
          for b in dist/elide-toolchain-*-linux-amd64.tar.xz; do
            case "$b" in *-sanitizer-*) continue ;; esac
            for s in $SANITIZER_VARIANTS; do
              a="${b%.tar.xz}-sanitizer-$s.tar.xz"
              if [ -f "$a" ] && [ -f "$a.sha256" ]; then echo "ok $a"; else echo "::error::missing $a(.sha256)"; missing=1; fi
            done
          done
          exit "$missing"
      - name: "Download signed provenance"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-provenance
          path: dist
      - name: "Verify release provenance"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in dist/*.tar.xz; do
            gh attestation verify "$asset" --bundle dist/toolchain-provenance.sigstore.json \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/job.release-build.yml" \
              --signer-digest "$GITHUB_SHA" --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" --deny-self-hosted-runners
          done
      - name: "GitHub Release"
        # dist/* = per platform: bundle, SBOM, sanitizer add-ons (Linux), each archive's .sha256.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "elide-toolchain ${GITHUB_REF_NAME#v}" --generate-notes
  mirror:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: "Setup: Harden Runner"
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: elide-toolchain-*
          merge-multiple: true
          path: dist
      - name: "Download signed provenance"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-provenance
          path: dist
      - name: "Mirror: prepare"
        id: ver
        run: |
          echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          mkdir -p latest && echo "${GITHUB_REF_NAME#v}" > latest/latest.txt
      - name: "Mirror: bundles"
        # Bundles and sanitizer add-ons under toolchain/<version>/: the R2 fallback of the action and
        # of `elide-toolchain addon install` (static.elideusercontent.com/toolchain/<version>/<asset>).
        uses: elide-tools/r2-upload-action@b59314040b32715ae31337cdbb7418582ade7cff # main @ 2025-12-22
        with:
          path: "./dist"
          target: "toolchain/${{ steps.ver.outputs.v }}"
          bucket: "elide-userdata-public"
          account-id: ${{ secrets.R2_ACCOUNT_ID }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - name: "Mirror: latest"
        uses: elide-tools/r2-upload-action@b59314040b32715ae31337cdbb7418582ade7cff # main @ 2025-12-22
        with:
          path: "./latest"
          target: "toolchain"
          bucket: "elide-userdata-public"
          account-id: ${{ secrets.R2_ACCOUNT_ID }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
