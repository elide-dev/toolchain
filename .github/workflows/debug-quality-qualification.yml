name: Bounded unpublished toolchain qualification
on:
  workflow_dispatch:
    inputs:
      runs:
        description: "One successful release-package run keyed by its package platform"
        type: string
        required: true
      target:
        description: One normal installer target
        type: choice
        default: x86_64-unknown-linux-gnu
        options: [x86_64-unknown-linux-gnu, x86_64-unknown-linux-musl, aarch64-unknown-linux-gnu, aarch64-unknown-linux-musl, arm64-apple-darwin]
concurrency:
  group: symbolication-qualification-${{ github.repository }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  provenance:
    timeout-minutes: 5
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Require the exact successful producer builds
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: ${{ inputs.runs }}
          TARGET: ${{ inputs.target }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          runs=json.loads(os.environ['RUNS'])
          target=os.environ['TARGET']
          assert target in {'x86_64-unknown-linux-gnu','x86_64-unknown-linux-musl','aarch64-unknown-linux-gnu','aarch64-unknown-linux-musl','arm64-apple-darwin'}
          platform='darwin-arm64' if target=='arm64-apple-darwin' else 'linux-arm64' if target.startswith('aarch64-') else 'linux-amd64'
          assert set(runs)=={platform}
          for platform,run in runs.items():
              assert type(run) is int and run>0
              request=urllib.request.Request(f'https://api.github.com/repos/elide-dev/toolchain/actions/runs/{run}',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
              with urllib.request.urlopen(request) as response: metadata=json.load(response)
              assert metadata['head_sha']=='e5365e07215ccfe81409ab5652d05a6c98c14606'
              assert metadata['conclusion']=='success',metadata['html_url']
              print(platform,run,metadata['head_sha'])
          with open('provenance.json','w') as stream:
              json.dump({'source':'e5365e07215ccfe81409ab5652d05a6c98c14606','runs':runs},stream)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: recovery-toolchain-action-provenance
          path: provenance.json
          retention-days: 90
  unit:
    timeout-minutes: 45
    needs: provenance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: e5365e07215ccfe81409ab5652d05a6c98c14606
          persist-credentials: false
      - run: git submodule update --init --depth=1 cflags
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -qq -y shellcheck
      - run: tests/run.sh
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Check the normal installer action
        working-directory: action
        run: bun install --frozen-lockfile && bun run typecheck && bun test
  action:
    needs: [provenance, unit]
    uses: ./.github/workflows/job.action-e2e.yml
    with:
      candidate-runs: ${{ inputs.runs }}
      sanitizer-addons: false
      qualification-target: ${{ inputs.target }}
