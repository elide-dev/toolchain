name: "Job - Isolated release build"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  readiness:
    name: Release isolation readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require release infrastructure
        env:
          ISOLATION_READY: ${{ vars.RELEASE_ISOLATION_READY }}
          REF_TYPE: ${{ github.ref_type }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$ISOLATION_READY" != true ]; then
            echo '::error::Configure the disposable release pools described in docs/slsa.md, then set RELEASE_ISOLATION_READY=true.'
            exit 1
          fi
          test "$REF_TYPE" = tag
          test "$EVENT_NAME" = push
  build:
    needs: readiness
    permissions:
      contents: read
    uses: ./.github/workflows/job.build.yml
    with:
      version: ${{ github.ref_name }}
      sanitizer-addons: true
      isolated-release: true
  e2e:
    needs: build
    permissions:
      contents: read
    uses: ./.github/workflows/job.action-e2e.yml
    with:
      sanitizer-addons: true
      isolated-release: true
  provenance:
    needs: [build, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: elide-toolchain-*
          merge-multiple: true
          path: dist
      # No checkout or execution of build outputs in this signing job.
      - name: Require release archives
        run: |
          shopt -s nullglob
          assets=(dist/*.tar.xz)
          test "${#assets[@]}" -gt 0
      - name: "Provenance"
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.tar.xz"
      - name: "Retain signed provenance"
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cp "$BUNDLE_PATH" dist/toolchain-provenance.sigstore.json
          jq -ce '.dsseEnvelope | select(.payloadType == "application/vnd.in-toto+json" and (.signatures | length > 0))' \
            "$BUNDLE_PATH" > dist/toolchain-provenance.intoto.jsonl
      - name: "Artifact: Signed provenance"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-provenance
          if-no-files-found: error
          path: |
            dist/toolchain-provenance.sigstore.json
            dist/toolchain-provenance.intoto.jsonl
