name: Unit tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: '2026.11.1'
          install_args: --locked
      - name: Install test prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -qq -y --no-install-recommends rsync
      - run: mise run setup
      - run: bash scripts/check-versions.sh
      - run: mise run test
      - name: Check bundled action is current
        run: |
          cd action
          bun run build
          git diff --exit-code -- dist/main.js
