name: Unit tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: '2026.11.1'
          install_args: --locked
      - name: Install test prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -qq -y --no-install-recommends rsync
      - run: mise run setup
      - run: bash scripts/check-versions.sh
      - run: mise run test
      - name: Check bundled action is current
        run: |
          cd action
          bun run build
          git diff --exit-code -- dist/main.js
