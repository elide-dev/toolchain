name: Unit tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: '2026.11.1'
          install_args: --locked
      - name: Install test prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -qq -y --no-install-recommends rsync
      - run: mise run setup
      - run: bash scripts/check-versions.sh
      - run: mise run test
      - name: Check bundled action is current
        run: |
          cd action
          bun run build
          git diff --exit-code -- dist/main.js
